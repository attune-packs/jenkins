ref: jenkins
label: "Jenkins"
description: "Safe Jenkins Remote Access API actions with Attune Key-backed credentials"
version: "0.1.0"
author: "Attune; adapted from work by James Fryman and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://www.jenkins.io/doc/book/using/remote-access-api/"
  repository_url: "https://github.com/attune-packs/jenkins"
  source_revision: "884692248ce19ae3220e88b5f4f5d446394e683a"
  source_version: "1.0.1"
  license: "Apache-2.0"

tags: [jenkins, ci, cd, automation, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
