ref: jenkins.build_term
label: "Force-Terminate Pipeline"
description: "Force running Pipeline steps to fail after exact confirmation; use only after stop"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: jenkins_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: jenkins.credentials, required: true}
  job_path: {type: string, required: true}
  build_number: {type: integer, minimum: 1, required: true}
  confirmation: {type: string, required: true, description: "Exactly: term build <job_path>#<number>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [jenkins, build, pipeline, terminate]
