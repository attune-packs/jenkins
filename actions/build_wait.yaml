ref: jenkins.build_wait
label: "Wait For Build"
description: "Poll one exact build until completion or a bounded timeout"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: jenkins_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: jenkins.credentials, required: true}
  job_path: {type: string, required: true}
  build_number: {type: integer, minimum: 1, required: true}
  max_wait_seconds: {type: integer, minimum: 1, maximum: 3600, default: 900}
  poll_interval_seconds: {type: integer, minimum: 1, maximum: 30, default: 5}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [jenkins, build, wait]
