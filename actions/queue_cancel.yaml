ref: jenkins.queue_cancel
label: "Cancel Queue Item"
description: "Cancel one exact queue ID after verifying its job and exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: jenkins_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: jenkins.credentials, required: true}
  queue_id: {type: integer, minimum: 1, required: true}
  job_path: {type: string, required: true}
  confirmation: {type: string, required: true, description: "Exactly: cancel queue <id> for <job_path>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [jenkins, queue, cancel]
